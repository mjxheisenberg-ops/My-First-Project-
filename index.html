<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="A simple daily task tracker built with HTML, CSS and JavaScript.">
  <title>Daily Task Tracker</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <header class="header">
      <p class="eyebrow">MY FIRST PROJECT</p>
      <h1>Daily Task Tracker</h1>
      <p class="subtitle">A simple space to plan your day, one task at a time.</p>
    </header>

    <section class="task-card" aria-label="Task list">
      <form id="task-form" class="task-form">
        <label class="sr-only" for="task-input">Add a task</label>
        <input id="task-input" type="text" placeholder="What do you need to do?" maxlength="100" required>
        <button type="submit">Add task</button>
      </form>

      <div class="toolbar">
        <span id="task-count">0 tasks left</span>
        <button id="clear-completed" class="text-button" type="button">Clear completed</button>
      </div>

      <ul id="task-list" class="task-list"></ul>
      <p id="empty-state" class="empty-state">Your list is clear. Add your first task above!</p>
    </section>

    <footer>Tasks are saved on this device automatically.</footer>
  </main>
  <script src="script.js"></script>
</body>
</html>
